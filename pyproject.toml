[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medtech-classifier"
version = "0.1.0"
description = "Educational EU MDR 2017/745 medical device regulatory classification tool"
requires-python = ">=3.10"
readme = "README.md"

[project.optional-dependencies]
# rules_engine / extraction / standards_mapper / cli.py use nothing
# outside the standard library - both groups below are purely for the
# dev/demo tooling around them.
dev = ["pytest", "coverage"]
ui = ["streamlit>=1.61"]

[tool.setuptools.packages.find]
include = ["rules_engine*", "extraction*", "standards_mapper*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
