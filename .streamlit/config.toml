# Streamlit theme for the MedTech Device Regulatory Classifier UI.
# Dark, clinical default - see ui/style.py for the custom CSS layered on
# top for the hero/card sections config.toml alone can't reach. Native
# components (st.badge, st.metric, st.dataframe, st.info/warning/error)
# still re-theme correctly if a viewer manually switches to light mode -
# see ui/render.py's module docstring for why the risk-ladder badges are
# built on st.badge rather than custom CSS.

[theme]
base = "dark"
primaryColor = "#2DD4BF"
backgroundColor = "#0B1220"
secondaryBackgroundColor = "#131C31"
textColor = "#E2E8F0"
font = "sans serif"

[server]
headless = true
